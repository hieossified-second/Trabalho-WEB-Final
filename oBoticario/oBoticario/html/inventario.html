<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário - oBoticário</title>
  <link rel="stylesheet" href="/css/inventario.css">
</head>
<body>

  <div class="app">

    <!-- ===== Menu Lateral ===== -->
    <aside class="sidebar">
      <div class="brand">
        <span>oBOTICÁRIO</span>
      </div>

      <nav class="nav">
        <a href="/html/Home.html">Home</a>
        <a href="/html/clientes.html">Clientes</a>
        <a href="/html/vendas.html">Vendas</a>
        <a href="/html/financeiro.html">Financeiro</a>
        <a href="#" class="ativo">Inventário</a>
      </nav>

      <div class="sidebar-footer">
        <hr>
        <p>Beleza é<br>se sentir bem.</p>
        <small>oBOTICÁRIO</small>
      </div>
    </aside>

    <!-- ===== Conteúdo Principal ===== -->
    <div class="main">

      <!-- Topbar -->
      <header class="topbar">
        <div class="search">
          <input type="search" placeholder="Buscar no sistema..." id="buscaGeral">
        </div>
        <div class="user">
        </div>
      </header>

      <!-- Cabeçalho da Página -->
      <div class="page-header">
        <div>
          <h1>Inventário</h1>
          <p>Gerencie os produtos e o estoque da sua loja.</p>
        </div>
        <button class="btn-adicionar" id="btnAdicionar" type="button">
  + Adicionar produto
</button>
      </div>

      <!-- Cards de Estatísticas do Estoque -->
      <section class="stats">
        <div class="stat">
          <div class="stat-icon">📦</div>
          <strong id="totalProdutos">0</strong>
          <span class="stat-label">Produtos em estoque</span>
        </div>
        <div class="stat">
          <div class="stat-icon alerta">⚠️</div>
          <strong id="estoqueBaixo">0</strong>
          <span class="stat-label">Produtos com estoque baixo</span>
        </div>
        <div class="stat">
          <div class="stat-icon perigo">❌</div>
          <strong id="semEstoque">0</strong>
          <span class="stat-label">Produtos sem estoque</span>
        </div>
      </section>

      <!-- Painel da Tabela e Filtros -->
      <section class="panel">
        
        <div class="filters">
          <div class="search-table">
            <input type="search" id="buscaProduto"
placeholder="Buscar por nome, código...">
          </div>
          <div class="select">
            <select id="filtroCategoria">
  <option value="">Todas as categorias</option>
  <option value="Perfumaria">Perfumaria</option>
  <option value="Cuidados Pessoais">Cuidados Pessoais</option>
  <option value="Cabelos">Cabelos</option>
  <option value="Kits">Kits</option>
</select>
          </div>
        </div>

        <!-- Tabela de Produtos -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Estoque</th>
                <th>Valor</th>
                <th class="col-acoes">Ações</th>
              </tr>
            </thead>
            <tbody id="listaProdutos">
</tbody>

          </table>
        </div>

      </section>
      
<!-- Modal de cadastro e edição -->
<div class="modal" id="modalProduto" hidden>
  <div class="modal-conteudo">
    <h2 id="tituloModal">Adicionar produto</h2>

    <form id="formProduto">

      <input type="hidden" id="produtoId">

      <label for="nomeProduto">Nome do produto</label>
      <input type="text" id="nomeProduto" required
        placeholder="Ex: Floratta Des. Colônia">

      <label for="categoriaProduto">Categoria</label>
      <select id="categoriaProduto" required>
        <option value="">Selecione uma categoria</option>
        <option value="Perfumaria">Perfumaria</option>
        <option value="Cuidados Pessoais">Cuidados Pessoais</option>
        <option value="Cabelos">Cabelos</option>
        <option value="Kits">Kits</option>
      </select>

      <label for="codigoProduto">Código do produto</label>
      <input type="text" id="codigoProduto"
        placeholder="Ex: BOT001">

      <label for="quantidadeProduto">Quantidade em estoque</label>
      <input type="number" id="quantidadeProduto"
        min="0" required>

      <label for="valorProduto">Valor (R$)</label>
      <input type="number" id="valorProduto"
        min="0" step="0.01" required>

      <div class="modal-acoes">
        <button type="button" id="btnCancelar">
          Cancelar
        </button>

        <button type="submit" class="btn-adicionar">
          Salvar produto
        </button>
      </div>

    </form>
  </div>
</div>


    </div>
  </div>

  <script src="/js/inventario.js"></script>


</body>
</html>
